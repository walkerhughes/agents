[project]
name = "trader-joes-mcp"
version = "0.1.1"
description = "Read-only MCP server for Trader Joe's public website data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
modal = ["harbor[modal]==0.18.0"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.0",
    "harbor==0.18.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
addopts = "-v"

[tool.ruff]
extend = "../../ruff.toml"
target-version = "py313"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 85
show_missing = true
